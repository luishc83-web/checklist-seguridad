name: Validar Checklist Pentesting

on:
  push:
    paths:
      - "checklist.md"

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar que existe checklist.md
        run: |
          if [ ! -f checklist.md ]; then
            echo "ERROR: checklist.md no existe"
            exit 1
          fi

      - name: Mostrar contenido del checklist
        run: cat checklist.md

      - name: Validación completada
        run: echo "Checklist de Pentesting validado correctamente"
